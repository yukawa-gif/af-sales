<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AF Sales | エー・ファクトリー</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{'sf-blue':'#0070D2','sf-navy':'#032D60'}}}}</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0070D2;--blue-dark:#005FB2;--blue-bg:#EAF4FF;
  --navy:#032D60;--navy-mid:#1B3A6B;
  --text:#111827;--text2:#4B5563;--text3:#9CA3AF;
  --border:#E5E7EB;--bg:#F3F4F6;--surface:#fff;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 4px 12px rgba(0,0,0,.1),0 16px 48px rgba(0,0,0,.1);
  --r:8px;--r-lg:12px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--navy);padding:0 24px;height:56px;display:flex;align-items:center;gap:12px}
.header-logo{width:28px;height:28px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center}
.header h1{color:#fff;font-size:16px;font-weight:700;letter-spacing:.01em}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px}
.welcome{text-align:center;margin-bottom:48px}
.welcome h2{font-size:28px;font-weight:800;color:var(--navy);margin-bottom:8px}
.welcome p{font-size:14px;color:var(--text2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;width:100%;max-width:900px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:16px;text-decoration:none;color:var(--text);border:1.5px solid transparent;transition:all .18s ease;cursor:pointer}
.card:hover{border-color:var(--blue);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.card-icon.blue{background:var(--blue-bg,#EAF4FF)}
.card-icon.green{background:#EEF8EF}
.card-icon.purple{background:#F4F0FA}
.card-title{font-size:17px;font-weight:700;color:var(--navy)}
.card-desc{font-size:13px;color:var(--text2);line-height:1.6}
.card-arrow{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--blue);margin-top:auto}
.footer{text-align:center;padding:24px;font-size:12px;color:var(--text3)}
</style>
</head>
<body>

<header class="header">
  <img src="af-logo.jpg" alt="AF FACTORY" style="height:28px;object-fit:contain">
</header>

<main class="main">
  <div class="welcome">
    <h2>エー・ファクトリー 営業管理</h2>
    <p>使用するツールを選択してください</p>
  </div>

  <div class="cards">
    <a href="dashboard.html" class="card">
      <div class="card-icon blue">
        <i data-lucide="layout-dashboard" style="width:24px;height:24px;color:#0070D2"></i>
      </div>
      <div>
        <div class="card-title">ダッシュボード</div>
        <div class="card-desc">KPI・月別推移・インセンティブ・AI分析。チーム全体と個人の営業実績を一覧で確認できます。</div>
      </div>
      <div class="card-arrow">
        <span>開く</span>
        <i data-lucide="arrow-right" style="width:14px;height:14px"></i>
      </div>
    </a>

    <a href="deal_form.html" class="card">
      <div class="card-icon green">
        <i data-lucide="file-plus" style="width:24px;height:24px;color:#2E844A"></i>
      </div>
      <div>
        <div class="card-title">案件登録</div>
        <div class="card-desc">新規案件の登録・既存案件の更新ができます。商材・確度ランク・粗利などを入力してください。</div>
      </div>
      <div class="card-arrow" style="color:#2E844A">
        <span>開く</span>
        <i data-lucide="arrow-right" style="width:14px;height:14px"></i>
      </div>
    </a>

    <a href="daily_report.html" class="card">
      <div class="card-icon purple">
        <i data-lucide="clipboard-list" style="width:24px;height:24px;color:#5A2BB5"></i>
      </div>
      <div>
        <div class="card-title">日報入力</div>
        <div class="card-desc">日々の活動報告を入力します。訪問・電話・メールなどの活動実績を記録してください。</div>
      </div>
      <div class="card-arrow" style="color:#5A2BB5">
        <span>開く</span>
        <i data-lucide="arrow-right" style="width:14px;height:14px"></i>
      </div>
    </a>
  </div>
</main>

<footer class="footer">
  &copy; 2026 エー・ファクトリー株式会社
</footer>

<script>lucide.createIcons();</script>
</body>
</html>
